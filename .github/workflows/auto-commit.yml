name: auto-commit

on:
  schedule:
    - cron: '0 0,8,16 * * *'
    - cron: '36 1,9,17 * * *'
    - cron: '12 3,11,19 * * *'
    - cron: '48 4,12,20 * * *'
    - cron: '24 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Modify a single line
        run: |
          echo "Activity: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > activity.txt

      - name: Commit and push
        run: |
          git config user.name 'Azaz-Gori07'
          git config user.email 'Azaz-Gori07@users.noreply.github.com'
          git add activity.txt
          if git diff --cached --quiet; then
            echo 'No change, skipping commit'
          else
            git commit -m "auto-commit: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
